<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HAUS of Nishka Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0806;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Lato', sans-serif;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 60px;
      border: 1px solid #b76e79;
      border-radius: 4px;
      position: relative;
      background: #0a0806;
    }

    /* Corner decorations */
    .logo-wrapper::before,
    .logo-wrapper::after {
      content: '✦';
      position: absolute;
      color: #b76e79;
      font-size: 0.8rem;
    }
    .logo-wrapper::before { top: 10px; left: 14px; }
    .logo-wrapper::after { bottom: 10px; right: 14px; }

    .corner-tr {
      position: absolute;
      top: 10px; right: 14px;
      color: #b76e79;
      font-size: 0.8rem;
    }
    .corner-bl {
      position: absolute;
      bottom: 10px; left: 14px;
      color: #b76e79;
      font-size: 0.8rem;
    }

    .logo-top-line {
      font-family: 'Lato', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #b76e79;
      margin-bottom: 8px;
    }

    .logo-icon {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .logo-main {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      color: #c9a87c;
      line-height: 1;
      text-shadow: 0 0 30px rgba(201,168,124,0.3);
      margin-bottom: 2px;
    }

    .logo-of {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.65rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #d4a0a7;
      margin-bottom: 2px;
    }

    .logo-name {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #e8b4b8;
      line-height: 1;
      margin-bottom: 10px;
    }

    .logo-divider {
      width: 100px;
      height: 1px;
      background: linear-gradient(to right, transparent, #b76e79, transparent);
      margin: 10px auto;
    }

    .logo-studio {
      font-family: 'Lato', sans-serif;
      font-size: 0.55rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #c9a87c;
      margin-top: 2px;
    }

    .logo-bottom-line {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: #4a3028;
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <span class="corner-tr">✦</span>
    <span class="corner-bl">✦</span>
    <p class="logo-top-line">✦ Gel X Nails ✦</p>
    <div class="logo-icon">💅</div>
    <div class="logo-main">Haus</div>
    <div class="logo-of">of</div>
    <div class="logo-name">Nishka</div>
    <div class="logo-divider"></div>
    <div class="logo-studio">Studio</div>
    <p class="logo-bottom-line">More than just nails... it's a vibe</p>
  </div>
</body>
</html>
